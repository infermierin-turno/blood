services:
  - type: web
    name: turno-med-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TURNI_SUPABASE_URL
        sync: false
      - key: TURNI_SUPABASE_KEY
        sync: false
